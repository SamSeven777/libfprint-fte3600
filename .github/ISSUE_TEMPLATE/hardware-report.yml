name: Hardware compatibility report
description: Report device discovery, setup or authentication problems
title: "[Hardware]: "
labels:
  - hardware-report
  - needs-hardware-testing
body:
  - type: markdown
    attributes:
      value: |
        Include only the information below. Keep fingerprints, templates, raw SPI dumps, vendor files and private logs local.
  - type: input
    id: computer
    attributes:
      label: Computer model and sensor identity, if known
      placeholder: One-Netbook A1, FT9361
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution, kernel and architecture
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Release or commit
      description: Output of git rev-parse --short HEAD
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Steps, expected behavior and actual error
      description: Describe the failing operation and error text. Redact personal identifiers and do not attach raw debug dumps.
    validations:
      required: true
