name: FTE3600

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fedora:
    name: Fedora 43
    runs-on: ubuntu-latest
    container: fedora:43
    steps:
      - name: Install dependencies
        run: >-
          dnf install -y git gcc gcc-c++ meson ninja-build
          pkgconf-pkg-config glib2-devel libgusb-devel libgudev-devel
          libgpiod-devel systemd systemd-devel cairo-devel
          policycoreutils selinux-policy-targeted setools-console
      - uses: actions/checkout@v6
      - name: Validate Fedora SELinux policy
        run: |
          semodule -i config/selinux/fte3600-gpio.cil
          semodule -lfull | grep -F fte3600-gpio
          sesearch -A -s fprintd_t -t gpio_device_t -c chr_file \
            -p getattr -p open -p read -p write -p ioctl
          semodule -r fte3600-gpio
      - name: Build both authentication policies
        run: ./scripts/check-fte3600.sh

  ubuntu:
    name: Ubuntu 26.04
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates git meson ninja-build pkg-config \
            libglib2.0-dev libgusb-dev libgudev-1.0-dev libgpiod-dev \
            libudev-dev systemd-dev libcairo2-dev
      - uses: actions/checkout@v6
      - name: Build both authentication policies
        run: ./scripts/check-fte3600.sh
